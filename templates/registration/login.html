{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card p-4" style="width: 100%; max-width: 380px;">
    <div class="text-center mb-4">
      <div class="stat-icon mx-auto mb-3"><i class="bi bi-wrench-adjustable"></i></div>
      <h1 class="h4 fw-bold mb-1">Taller Buga</h1>
      <p class="text-secondary mb-0">en el Berbés · Vigo</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
